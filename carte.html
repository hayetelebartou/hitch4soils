<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our route – Hitch4Soils</title>
<meta name="description" content="The map of our trip, from Geneva to the Pacific coast.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hitch4Soils">
<meta property="og:title" content="Hitch4Soils – 1 cent per kilometre for the farmers of South Lebanon">
<meta property="og:description" content="Two friends hitchhike from Geneva to the Pacific. Every kilometre helps farms and gardens in Lebanon.">
<meta property="og:image" content="https://hitch4soils.netlify.app/img/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="doc_map">

<header>
  <div class="wrap">
    <a class="brand" href="index.html">Hitch4Soils</a>
    <nav class="nav" aria-label="Menu">
      <a href="index.html" data-i18n="nav_home"></a>
      <a href="projets.html" data-i18n="nav_projects"></a>
      <a href="carte.html" aria-current="page" data-i18n="nav_map"></a>
    </nav>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
    </div>
  </div>
</header>

<main>
<div class="wrap">

  <div class="page-title">
    <h1 data-i18n="map_title"></h1>
    <p class="lead" data-i18n="map_lead"></p>
    <div class="btns"><a class="btn primary" id="map-open" data-link="mapUrl" href="#" target="_blank" rel="noopener" data-i18n="map_open"></a></div>
  </div>

  <section id="carte">
    <iframe id="map-frame" data-i18n-title="map_frame" title="Carte" hidden loading="lazy"></iframe>
    <p class="note" data-i18n="map_note"></p>
    <p class="note"><span data-i18n="count_updated"></span> <span id="km-date"></span> · <span id="km-done"></span> km</p>
  </section>

</div>
</main>

<footer>
  <div class="wrap" data-i18n="footer"></div>
</footer>

<script src="config.js"></script>
<script src="texts.js"></script>
<script src="common.js"></script>
<script>
if (CONFIG.mapUrl && /^https:\/\//.test(CONFIG.mapUrl)){
  var mf = document.getElementById("map-frame");
  mf.src = CONFIG.mapUrl;
  mf.hidden = false;
}
document.getElementById("km-done").textContent = CONFIG.kmDone.toLocaleString("fr-CH");
langHooks.push(function(){ document.getElementById("km-date").textContent = CONFIG.kmDate || "–"; });
initPage();
</script>
</body>
</html>
